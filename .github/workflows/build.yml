# CI build check for the SSMTS Android app.
# Assembles the debug APK on every push and pull request.
# The Google Maps key is not needed to compile; build.gradle.kts falls back
# to a placeholder when local.properties is absent.
name: Build Android

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ssmts-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
